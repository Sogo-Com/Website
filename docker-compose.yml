version: '3'
services:
  sogocom:
    image: svelte-docker-node
    build:
      context: .
      dockerfile: Dockerfile
      target: deploy-node
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sogocom.rule=Host(`www.sogocom.fr`,`sogocom.fr`)"
      - "traefik.http.routers.sogocom.entrypoints=http"
      - "traefik.http.routers.sogocom-secure.rule=Host(`www.sogocom.fr`,`sogocom.fr`)"
      - "traefik.http.routers.sogocom-secure.entrypoints=https"
      - "traefik.http.routers.sogocom.middlewares=sogocom-redirect,default@file"
      - "traefik.http.routers.sogocom-secure.tls=true"
      - "traefik.http.services.sogocom.loadbalancer.server.port=3000"
      - "traefik.http.routers.sogocom-secure.middlewares=sogocom-redirect"
      - "traefik.http.routers.sogocom.middlewares=sogocom-redirect"
      - "traefik.http.middlewares.sogocom-redirect.redirectregex.regex=^https?://sogocom\\.fr/(.*)"
      - "traefik.http.middlewares.sogocom-redirect.redirectregex.replacement=https://www.sogocom.fr/$${1}"
      - "traefik.http.middlewares.sogocom-redirect.redirectregex.permanent=false"
    volumes:
      - type: bind
        source: ./prisma/dev.db
        target: /app/dev.db
      - type: bind
        source: ./uploads/
        target: /app/uploads/
networks:
  traefik-net:
   external: true
