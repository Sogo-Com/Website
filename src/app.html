<!DOCTYPE html>
<html lang="fr">
	<head>
		<!-- Google Tag Manager -->
		<script>
			(function (w, d, s, l, i) {
				w[l] = w[l] || [];
				w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
				var f = d.getElementsByTagName(s)[0],
					j = d.createElement(s),
					dl = l != 'dataLayer' ? '&l=' + l : '';
				j.async = true;
				j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
				f.parentNode.insertBefore(j, f);
			})(window, document, 'script', 'dataLayer', 'GTM-N6ZMZRJV');
		</script>
		<!-- End Google Tag Manager -->

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />

		<!--
			Axeptio (injecté par GTM) monte un overlay #axeptio_overlay en position fixed
			avec z-index 2147483647. Même quand il ne rend aucune UI (opacity 0, aucun
			enfant), il capte les événements tactiles sur toute la page : sur mobile le
			scroll et le bouton du menu deviennent inutilisables.
			On neutralise le mount lui-même ; les enfants réels (bannière cookies)
			restent cliquables. Le !important est nécessaire car Axeptio pose
			`pointer-events: initial` en style inline sur son conteneur interne.
		-->
		<style>
			#axeptio_overlay,
			#axeptio_overlay > div {
				pointer-events: none !important;
			}
			#axeptio_overlay > div > * {
				pointer-events: auto !important;
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background: #f5f5f5">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Google Tag Manager (noscript) -->
		<noscript
			><iframe
				src="https://www.googletagmanager.com/ns.html?id=GTM-N6ZMZRJV"
				height="0"
				width="0"
				style="display: none; visibility: hidden"
			></iframe
		></noscript>
		<!-- End Google Tag Manager (noscript) -->
	</body>
</html>
