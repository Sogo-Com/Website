name: CI/CD

on:
  push:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.PROD_HOST }}
      USERNAME: ${{ secrets.PROD_USERNAME }}
      PASSWORD: ${{ secrets.PROD_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: SSH and deploy
      uses: appleboy/ssh-action@master
      with:
        username: ${{ secrets.PROD_USERNAME }}
        host: ${{ secrets.PROD_HOST }}
        password: ${{ secrets.PROD_PASSWORD }} 
        script: cd /home/sogocom/dev/sogocom/Website && git pull && docker compose up -d --force-recreate --build --no-deps